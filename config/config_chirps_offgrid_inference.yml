# Overwrite config for a single inference run of a CHIRPS decoder (e.g. zjk1udv3) with CHIRPS
# predicted at the Mozambique rain gauge stations instead of on its grid. ERA5 stays on its grid.
# Use it together with --from-run-id, e.g.
#
#   uv run --offline inference --from-run-id zjk1udv3 --config config/config_chirps_offgrid_inference.yml
#
# Streams are inherited from the config of the trained model; only the reader of CHIRPS is
# switched to the offgrid one (see data_reader_offgrid.py). Do not set streams_directory in this
# file: that would replace the inherited streams instead of extending them. For the same run on
# the grid see config_chirps_grid_inference.yml.

test_config:
  # one forecast needs (num_steps + offset + 1) = 10 daily windows after its init, so leave at
  # least 11 days; the number of forecasts is set by samples_per_mini_epoch
  start_date: 2023-06-01T00:00
  end_date: 2023-06-15T00:00
  samples_per_mini_epoch: 1
  output:
    num_samples: 1

data_loading:
  # the sample count is rounded down to a multiple of batch_size * num_workers; with more workers
  # than samples nothing is run
  num_workers: 1

streams:
  CHIRPS:
    type: offgrid
    # reader type the stream was trained with; provides channels and normalization
    base_type: chirps
    # overrides the old CHIRPS paths stored in the trained models' configs
    filenames: [
      '/e/data1/slmet/ml_training/chirpsv3/chirpsv3_1981.zarr',
      '/e/data1/slmet/ml_training/chirpsv3/chirpsv3_1982.zarr',
      '/e/data1/slmet/ml_training/chirpsv3/chirpsv3_1983.zarr',
      '/e/data1/slmet/ml_training/chirpsv3/chirpsv3_1984.zarr',
      '/e/data1/slmet/ml_training/chirpsv3/chirpsv3_1985.zarr',
      '/e/data1/slmet/ml_training/chirpsv3/chirpsv3_1986.zarr',
      '/e/data1/slmet/ml_training/chirpsv3/chirpsv3_1987.zarr',
      '/e/data1/slmet/ml_training/chirpsv3/chirpsv3_1988.zarr',
      '/e/data1/slmet/ml_training/chirpsv3/chirpsv3_1989.zarr',
      '/e/data1/slmet/ml_training/chirpsv3/chirpsv3_1990.zarr',
      '/e/data1/slmet/ml_training/chirpsv3/chirpsv3_1991.zarr',
      '/e/data1/slmet/ml_training/chirpsv3/chirpsv3_1992.zarr',
      '/e/data1/slmet/ml_training/chirpsv3/chirpsv3_1993.zarr',
      '/e/data1/slmet/ml_training/chirpsv3/chirpsv3_1994.zarr',
      '/e/data1/slmet/ml_training/chirpsv3/chirpsv3_1995.zarr',
      '/e/data1/slmet/ml_training/chirpsv3/chirpsv3_1996.zarr',
      '/e/data1/slmet/ml_training/chirpsv3/chirpsv3_1997.zarr',
      '/e/data1/slmet/ml_training/chirpsv3/chirpsv3_1998.zarr',
      '/e/data1/slmet/ml_training/chirpsv3/chirpsv3_1999.zarr',
      '/e/data1/slmet/ml_training/chirpsv3/chirpsv3_2000.zarr',
      '/e/data1/slmet/ml_training/chirpsv3/chirpsv3_2001.zarr',
      '/e/data1/slmet/ml_training/chirpsv3/chirpsv3_2002.zarr',
      '/e/data1/slmet/ml_training/chirpsv3/chirpsv3_2003.zarr',
      '/e/data1/slmet/ml_training/chirpsv3/chirpsv3_2004.zarr',
      '/e/data1/slmet/ml_training/chirpsv3/chirpsv3_2005.zarr',
      '/e/data1/slmet/ml_training/chirpsv3/chirpsv3_2006.zarr',
      '/e/data1/slmet/ml_training/chirpsv3/chirpsv3_2007.zarr',
      '/e/data1/slmet/ml_training/chirpsv3/chirpsv3_2008.zarr',
      '/e/data1/slmet/ml_training/chirpsv3/chirpsv3_2009.zarr',
      '/e/data1/slmet/ml_training/chirpsv3/chirpsv3_2010.zarr',
      '/e/data1/slmet/ml_training/chirpsv3/chirpsv3_2011.zarr',
      '/e/data1/slmet/ml_training/chirpsv3/chirpsv3_2012.zarr',
      '/e/data1/slmet/ml_training/chirpsv3/chirpsv3_2013.zarr',
      '/e/data1/slmet/ml_training/chirpsv3/chirpsv3_2014.zarr',
      '/e/data1/slmet/ml_training/chirpsv3/chirpsv3_2015.zarr',
      '/e/data1/slmet/ml_training/chirpsv3/chirpsv3_2016.zarr',
      '/e/data1/slmet/ml_training/chirpsv3/chirpsv3_2017.zarr',
      '/e/data1/slmet/ml_training/chirpsv3/chirpsv3_2018.zarr',
      '/e/data1/slmet/ml_training/chirpsv3/chirpsv3_2019.zarr',
      '/e/data1/slmet/ml_training/chirpsv3/chirpsv3_2020.zarr',
      '/e/data1/slmet/ml_training/chirpsv3/chirpsv3_2021.zarr',
      '/e/data1/slmet/ml_training/chirpsv3/chirpsv3_2022.zarr',
      '/e/data1/slmet/ml_training/chirpsv3/chirpsv3_2023.zarr',
      '/e/data1/slmet/ml_training/chirpsv3/chirpsv3_2024.zarr',
      '/e/data1/slmet/ml_training/chirpsv3/chirpsv3_2025.zarr',
      '/e/data1/slmet/ml_training/chirpsv3/chirpsv3_2026.zarr',
      ]
    offgrid:
      # predict at the rain gauge observations, with the gauge totals as targets, so that
      # evaluation scores the forecast against them; every gauge reading on a forecast day is a
      # point. For forecasts at fixed points without targets use instead
      #   coords: /e/project1/e-ext-2025e01-128/bender3/data/moz_stations/latlon.npy
      obs:
        file: /e/project1/e-ext-2025e01-128/bender3/data/moz_stations/precip-daily-gauge-corrected-moz-1998-2026-v1.zarr
        # CHIRPS tp and the gauge totals are both mm/day
        channels: {tp: obsvalue_tp_0}
      # CHIRPS has no geoinfo channels, so no geoinfos are needed
      # CHIRPS days are labelled at 23:00 (daily_anchor) and the decoder sees the time of day of
      # its targets, so the station points are labelled the same way
      time_offset: 23h
