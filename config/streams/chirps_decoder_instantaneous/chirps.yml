# CHIRPS v3 daily precipitation: the single output stream of the decoder trained on the
# frozen ERA5 N320 model emgqf93u (24 h windows like hoya9ez6, but an instantaneous ERA5 state as
# input instead of the daily mean). Read at native 0.05 degree resolution by
# DataReaderChirps (packages/readers_extra/.../data_reader_chirps.py).

CHIRPS :
  type : chirps
  # ERA5_in is 0 and ERA5 is 1 in emgqf93u (as in hoya9ez6). The id is also fed to the decoder as a plain
  # number next to the target coordinates, so it is kept small.
  stream_id : 2

  # Time of day a CHIRPS day is labelled with. A value stamped day D in the stores is the rain
  # of D 00:00 to D+1 00:00 UTC. The windows of emgqf93u are [D 00:00, D+1 00:00), as in hoya9ez6;
  # its input state of day D is valid at D 18:00 and its (switched-off) ERA5 output, a daily mean,
  # is labelled D 23:00. Labelling CHIRPS day D at D 23:00 puts it into the window of day D.
  # Checked by scripts_vh/chirps/check_time_alignment.py --base-run emgqf93u.
  daily_anchor : 23:00:00

  # Single field 'band' in the stores, exposed under this channel name.
  channels : ['tp']

  # Decoder setup: ERA5 goes in, CHIRPS is predicted only.
  diagnostic : True
  source : []
  target : ['tp']

  # log1p transform: the model is trained on log(1 + mm/day), and predictions are transformed back
  # with exp(x) - 1. mean / stdev are the statistics of the field as it is trained on (after the
  # transform) and must be changed together with `transform`. They are taken over all valid
  # pixels of every day of the training period 1991-2022 (46.4e9 values), each pixel counting
  # once, which is how target points are drawn.
  # Regenerate with: scripts_vh/chirps/chirps_stats.py --start-year 1991 --end-year 2022
  # transform : log1p
  # mean  : [0.6202904999245274]
  # stdev : [0.9498290914151316]
  # Without transform, use instead (and change desc in config_chirps_decoder_instantaneous.yml):
  transform : null
  mean  : [2.605484324517578]
  stdev : [6.747491523097179]

  # The reader returns every valid land pixel of a day (3.97M). This many are drawn at random
  # per forecast step, afresh for every sample, by the data sampler. 8 steps x 65536 is about
  # the number of targets of ONE step of the ERA5 stream emgqf93u was trained with (542080).
  # As in the hoya9ez6 runs o3z4t233 / dmdh2cjg; 542080 gave no gain there, and -1 (all 3.97M
  # pixels) does not fit on a GPU in training.
  max_num_targets : 65536

  loss_weight : 1.0
  # CHIRPS spans 50N-50S, so cell area varies by ~1.6x across the domain.
  location_weight : cosine_latitude

  # token_size / tokenize_spacetime affect source tokenization only, so they are inert for a
  # target-only stream; kept at the values of the ERA5 output stream of emgqf93u (= hoya9ez6).
  token_size : 512
  tokenize_spacetime : False

  # The stores are read in place from another user's project directory (absolute paths).
  # One store per year, one reader per store; stores outside a run's dates return nothing.
  filenames : [
    '/e/project1/e-ext-2025e01-128/bender3/data/chirpsv3/chirpsv3_1981.zarr',
    '/e/project1/e-ext-2025e01-128/bender3/data/chirpsv3/chirpsv3_1982.zarr',
    '/e/project1/e-ext-2025e01-128/bender3/data/chirpsv3/chirpsv3_1983.zarr',
