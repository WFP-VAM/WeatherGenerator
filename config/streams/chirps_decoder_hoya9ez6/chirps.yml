    '/e/project1/e-ext-2025e01-128/bender3/data/chirpsv3/chirpsv3_2023.zarr',
    '/e/project1/e-ext-2025e01-128/bender3/data/chirpsv3/chirpsv3_2024.zarr',
    '/e/project1/e-ext-2025e01-128/bender3/data/chirpsv3/chirpsv3_2025.zarr',
    '/e/project1/e-ext-2025e01-128/bender3/data/chirpsv3/chirpsv3_2026.zarr',
    ]

  # Decoder head: new modules, trained from scratch. Same geometry as the ERA5 output stream
  # of hoya9ez6.
  embed :
    net : transformer
    num_tokens : 1
    num_heads : 4
    dim_embed : 512
    num_blocks : 2
  embed_target_coords :
    net : linear
    dim_embed : 512
  target_readout :
    num_layers : 2
    num_heads : 4
  pred_head :
    ens_size : 1
    num_layers : 1
